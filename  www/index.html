
<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P&C Game Shop</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }
    .shop {
      background: #1e293b;
      padding: 25px;
      border-radius: 15px;
      max-width: 400px;
      margin: auto;
    }
    h1 { color: #38bdf8; }
    button {
      background: #0ea5e9;
      color: white;
      border: 0;
      padding: 14px 25px;
      border-radius: 8px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="shop">
    <h1>P&C Game Shop</h1>
    <h2>Game Top-up Shop</h2>
    <p>မင်္ဂလာပါ။ P&C Game Shop မှ ကြိုဆိုပါတယ်။</p>
    <p>Game Top-up ဝန်ဆောင်မှုများကို ရရှိနိုင်ပါပြီ။</p>
    <button onclick="alert('P&C Game Shop မှ ကြိုဆိုပါတယ်။')">
      စတင်အသုံးပြုမယ်
    </button>
  </div>
</body>
</html>
